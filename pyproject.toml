[project]
name = "deepfacelab"
version = "1.0.0"
description = "DeepFaceLab Web UI"
requires-python = ">=3.8,<3.9"
dependencies = [
    "tqdm",
    "numpy",
    "numexpr",
    "h5py",
    "opencv-python>=4.5.0",
    "ffmpeg-python",
    "scikit-image>=0.17.0",
    "scipy>=1.5.0",
    "colorama",
    "pyqt5",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "tensorflow-gpu==2.4.0",
    "tf2onnx==1.9.3",
    "protobuf<=3.20",
    "typing-extensions>=3.10",
]

[tool.uv]
override-dependencies = [
    "typing-extensions>=4.0",
]

[dependency-groups]
dev = []
